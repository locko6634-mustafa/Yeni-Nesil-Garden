name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yesil-nesil-garden-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate static files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f hayal-bahce.html
          test -f kale-bahce.html
          test -f masal-bahce.html
          test -f ruya-bahce.html
          test -f css/home/site.css
          test -f css/garden-pages/garden-pages.css
          test -f js/home/app.js
          test -f js/garden-pages/app.js
          test -f compose.production.yaml
          test -f deploy/Dockerfile
          test -f deploy/nginx.conf
          test -d assets/fonts
          test -d storage/public-media/images
          node --check js/home/app.js
          node --check js/garden-pages/app.js
          node --test tools/serve.test.mjs

      - name: Validate production routes
        shell: bash
        run: |
          set -euo pipefail

          image_name="yesil-nesil-garden:ci-${GITHUB_SHA}"
          container_name="yesil-nesil-garden-ci"

          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker build \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --tag "$image_name" \
            --file deploy/Dockerfile \
            .

          docker run \
            --detach \
            --rm \
            --name "$container_name" \
            --publish 127.0.0.1:18080:8080 \
            --mount "type=bind,source=$PWD/storage/public-media,target=/srv/yesil-nesil-garden-media,readonly" \
            "$image_name"

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi

            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null

          for route in / /hayal-bahce /kale-bahce /masal-bahce /ruya-bahce; do
            curl --fail --silent --show-error "http://127.0.0.1:18080$route" >/dev/null
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/css/garden-pages/garden-pages.css >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:18080/css/garden-pages/garden-pages.css | grep --ignore-case '^Cache-Control: no-cache'

          curl --fail --silent --show-error http://127.0.0.1:18080/media/images/favicon-32.png >/dev/null

          legacy_css_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/garden-pages.css)"
          test "$legacy_css_status" = "404"

          legacy_media_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/assets/favicon-32.png)"
          test "$legacy_media_status" = "404"

          redirect_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/hayal-bahce.html)"
          test "$redirect_status" = "301"

      - name: Check deployment secrets
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=true

          for variable in SERVER_HOST SERVER_PORT SERVER_USER SERVER_SSH_KEY SERVER_HOST_FINGERPRINT; do
            if test -z "${!variable:-}"; then
              echo "::warning::Missing GitHub secret: ${variable}"
              ready=false
            fi
          done

          if test "$ready" = "true" && [[ ! "$SERVER_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::warning::SERVER_HOST_FINGERPRINT is not a valid SHA256 fingerprint"
            ready=false
          fi

          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          scanned_host_key="$(ssh-keyscan -p "$SERVER_PORT" -t ed25519 "$SERVER_HOST" 2>/dev/null)"
          test -n "$scanned_host_key"
          scanned_fingerprint="$(printf '%s\n' "$scanned_host_key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"

          if test "$scanned_fingerprint" != "$SERVER_HOST_FINGERPRINT"; then
            echo "SSH host fingerprint mismatch" >&2
            exit 1
          fi

          printf '%s\n' "$scanned_host_key" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat << 'EOF' > "$HOME/.ssh/config"
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 30
            TCPKeepAlive yes
            KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha256
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Test SSH connection
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -v -i "$HOME/.ssh/id_ed25519" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o KexAlgorithms=curve25519-sha256,curve25519-sha256@libssh.org \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o ConnectTimeout=30 \
            -o TCPKeepAlive=yes \
            "$SERVER_USER@$SERVER_HOST" "echo 'SSH connection verified successfully on host \$(hostname)'"

      - name: Sync static site
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts="-i $HOME/.ssh/id_ed25519 -p $SERVER_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o KexAlgorithms=curve25519-sha256,curve25519-sha256@libssh.org -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=30 -o TCPKeepAlive=yes"

          synced=false
          for attempt in 1 2 3; do
            echo "Sync attempt $attempt..."
            if rsync -avz --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.agents/' \
              --exclude='storage/public-media/videos/' \
              --exclude='run_server.bat' \
              --exclude='sunucu_baslat.ps1' \
              --exclude='tools/' \
              -e "ssh $ssh_opts" \
              ./ "$SERVER_USER@$SERVER_HOST:/opt/yesil-nesil-garden/app/"; then
              synced=true
              break
            fi
            echo "Attempt $attempt failed, retrying in 5 seconds..."
            sleep 5
          done

          if [ "$synced" != "true" ]; then
            echo "rsync failed after 3 attempts" >&2
            exit 1
          fi

      - name: Build and activate release
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o KexAlgorithms=curve25519-sha256,curve25519-sha256@libssh.org \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o ConnectTimeout=30 \
            -o TCPKeepAlive=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/yesil-nesil-garden/app && BUILD_REVISION='$GITHUB_SHA' docker compose -f compose.production.yaml up -d --build --remove-orphans --wait --wait-timeout 90"

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
