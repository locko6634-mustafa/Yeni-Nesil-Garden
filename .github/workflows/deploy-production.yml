name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yesil-nesil-garden-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate static files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f hayal-bahce.html
          test -f kale-bahce.html
          test -f masal-bahce.html
          test -f ruya-bahce.html
          test -f styles.css
          test -f garden-pages.css
          test -f script.js
          test -f compose.production.yaml
          test -f deploy/Dockerfile
          test -f deploy/nginx.conf
          test -d assets
          node --check script.js

      - name: Check deployment secrets
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=true

          for variable in SERVER_HOST SERVER_PORT SERVER_USER SERVER_SSH_KEY SERVER_HOST_FINGERPRINT; do
            if test -z "${!variable:-}"; then
              echo "::warning::Missing GitHub secret: ${variable}"
              ready=false
            fi
          done

          if test "$ready" = "true" && [[ ! "$SERVER_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::warning::SERVER_HOST_FINGERPRINT is not a valid SHA256 fingerprint"
            ready=false
          fi

          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          scanned_host_key="$(ssh-keyscan -p "$SERVER_PORT" -t ed25519 "$SERVER_HOST" 2>/dev/null)"
          test -n "$scanned_host_key"
          scanned_fingerprint="$(printf '%s\n' "$scanned_host_key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"

          if test "$scanned_fingerprint" != "$SERVER_HOST_FINGERPRINT"; then
            echo "SSH host fingerprint mismatch" >&2
            exit 1
          fi

          printf '%s\n' "$scanned_host_key" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync static site
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete --delay-updates \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.agents/' \
            --exclude='run_server.bat' \
            --exclude='sunucu_baslat.ps1' \
            --exclude='tools/' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p $SERVER_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$SERVER_USER@$SERVER_HOST:/opt/yesil-nesil-garden/app/"

      - name: Build and activate release
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/yesil-nesil-garden/app && BUILD_REVISION='$GITHUB_SHA' docker compose -f compose.production.yaml up -d --build --remove-orphans --wait --wait-timeout 90"

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
