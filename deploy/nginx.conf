server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/xml text/plain text/xml;

    client_max_body_size 10k;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; frame-src https://www.google.com https://maps.google.com; connect-src 'none'; media-src 'self'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /media/videos/ {
        alias /srv/yesil-nesil-garden-media/videos/;
        autoindex off;
        disable_symlinks on;
        expires 30d;

        if ($uri ~ "(^|/)\.") {
            return 404;
        }

        limit_except GET HEAD {
            deny all;
        }
    }

    location ^~ /media/images/ {
        alias /srv/yesil-nesil-garden-media/images/;
        autoindex off;
        disable_symlinks on;
        expires 30d;

        if ($uri ~ "(^|/)\.") {
            return 404;
        }

        limit_except GET HEAD {
            deny all;
        }
    }

    location ^~ /media/ {
        alias /srv/yesil-nesil-garden-media/;
        autoindex off;
        disable_symlinks on;
        expires 1d;

        if ($uri ~ "(^|/)\.") {
            return 404;
        }

        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ /\. {
        deny all;
    }

    location = / {
        expires -1;

        limit_except GET HEAD {
            deny all;
        }

        try_files /index.html =404;
    }

    location = /index.html {
        expires -1;

        if ($request_uri ~ "^/index\.html(?:\?|$)") {
            return 301 https://yesilnesilthegarden.com/;
        }

        try_files $uri =404;
    }

    location = /index {
        return 301 https://yesilnesilthegarden.com/;
    }

    location = /robots.txt {
        expires 1h;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1h;
        try_files $uri =404;
    }

    location ~ ^/(hayal-bahce|kale-bahce|masal-bahce|ruya-bahce)\.html$ {
        return 301 https://yesilnesilthegarden.com/$1;
    }

    location ~ ^/(hayal-bahce|kale-bahce|masal-bahce|ruya-bahce)/$ {
        return 301 https://yesilnesilthegarden.com/$1;
    }

    location ~* \.(?:css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpe?g|gif|ico|svg)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;

        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri.html =404;
    }
}
